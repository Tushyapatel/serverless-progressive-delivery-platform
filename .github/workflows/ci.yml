name: CI-CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: npm run build

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

  docker-build:
    needs:
      - frontend
      - backend

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

     - name: Build Backend Docker Image
  run: docker build -f backend/Dockerfile -t progressive-backend backend

- name: Build Frontend Docker Image
  run: docker build -f frontend/Dockerfile -t progressive-frontend frontend